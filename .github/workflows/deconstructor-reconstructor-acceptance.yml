name: Deconstructor Reconstructor acceptance
on:
  push:
    branches: [work/deconstructor-reconstructor-next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Frontend unit tests
        run: npm test -- --reporter=default

  backend-export:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio numpy
      - name: Actual FFmpeg MP4 and reconstruction regression
        run: |
          python -m pytest -q tests/test_timeline_render.py::test_render_project_single_clip_with_text_and_audio tests/test_behind_footage.py

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install isolated browser automation
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Build frontend and start preview
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/studio-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio-preview.log
          exit 1
      - name: Chromium smoke test for protected editor routes
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          for (const route of ['/deconstructor', '/video-studio-v2']) {
            await page.goto('http://127.0.0.1:4173' + route);
            await page.waitForURL('**/login', {timeout:15000});
            const body = await page.locator('body').innerText();
            if (!body.trim()) throw new Error(route + ': blank login page');
            console.log(route + ': unauthenticated route correctly redirects to login');
          }
          if (errors.length) throw new Error('Browser runtime errors: ' + errors.join(' | '));
          await browser.close();
          EOF
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-log
          path: /tmp/studio-preview.log
