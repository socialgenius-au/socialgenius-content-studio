name: Image processing regression
on:
  push:
    branches:
      - work/deconstructor-reconstructor-next
  workflow_dispatch:

jobs:
  offline-image-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal offline test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow numpy opencv-python-headless httpx pydantic-settings
      - name: Run image regression tests
        run: |
          python -m pytest tests/test_image_enhancement.py tests/test_image_generation.py -q
